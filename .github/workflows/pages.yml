name: Deploy Math Games to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: PUBLIC_URL="${{ steps.pages.outputs.base_url }}" node scripts/sync-publish.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
